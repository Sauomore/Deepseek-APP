<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17181c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Deepseek APP" />
    <meta name="format-detection" content="telephone=no" />
    <title>Deepseek APP</title>

    <!-- Boot splash: painted by CSS before React mounts, so the WebView never flashes white. -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #ffffff;
        -webkit-tap-highlight-color: transparent;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #17181c;
        }
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: inherit;
        z-index: 9999;
        transition: opacity 0.28s ease;
      }
      #boot-splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .boot-mark {
        width: 76px;
        height: 76px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, #5b78ff 0%, #3b57e8 100%);
        color: #ffffff;
        font:
          700 31px/1 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: -0.02em;
        box-shadow: 0 12px 34px rgba(77, 107, 254, 0.28);
        animation: boot-breathe 1.6s ease-in-out infinite;
      }
      #boot-splash .wordmark {
        font:
          600 21px/1 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0.2px;
        color: #1a1a1a;
        opacity: 0.9;
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash .wordmark {
          color: #eceef2;
        }
      }
      @keyframes boot-breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.92;
        }
        50% {
          transform: scale(1.06);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="boot-mark">DS</div>
      <div class="wordmark">Deepseek APP</div>
    </div>    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
